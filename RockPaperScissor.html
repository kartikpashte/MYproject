<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors - Upgraded</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 500px;
      font-size: 1.4rem;
      margin: 20px 0;
    }

    .choices {
      display: flex;
      gap: 30px;
      margin: 30px 0;
    }

    .btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
    }

    .btn:hover {
      transform: scale(1.1);
    }

    .btn img {
      width: 60%;
    }

    .result {
      font-size: 1.8rem;
      margin: 20px;
      min-height: 2rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .highlight {
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    button.new-game {
      padding: 10px 25px;
      font-size: 1.2rem;
      margin-top: 20px;
      cursor: pointer;
      background: #ff7e5f;
      border: none;
      color: white;
      border-radius: 10px;
    }

    button.new-game:hover {
      background: #feb47b;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      color: #fff;
    }

    .modal-content h2 {
      margin-bottom: 20px;
    }

    .modal-content button {
      background: #ff7e5f;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: #feb47b;
    }
  </style>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <div class="scoreboard">
    <div id="player-score">👤 Player: 0</div>
    <div id="computer-score">💻 Computer: 0</div>
  </div>

  <div class="choices">
    <div class="btn" data-choice="Rock"><img src="https://img.icons8.com/emoji/96/rock-emoji.png"/></div>
    <div class="btn" data-choice="Paper"><img src="https://img.icons8.com/emoji/96/raised-back-of-hand-emoji.png"/></div>
    <div class="btn" data-choice="Scissors"><img src="https://img.icons8.com/emoji/96/victory-hand-emoji.png"/></div>
  </div>

  <div class="result" id="result"></div>
  <button class="new-game" onclick="game.reset()">New Game</button>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Game Over</h2>
      <p id="modal-msg">You win!</p>
      <button onclick="game.reset(true)">Play Again</button>
    </div>
  </div>

  <script>
    class RPSGame {
      constructor() {
        this.playerScore = 0;
        this.computerScore = 0;
        this.winningScore = 5;
        this.round = 1;
        this.gameOver = false;

        this.playerScoreEl = document.getElementById('player-score');
        this.computerScoreEl = document.getElementById('computer-score');
        this.resultEl = document.getElementById('result');
        this.modal = document.getElementById('modal');
        this.modalMsg = document.getElementById('modal-msg');

        this.choices = ['Rock', 'Paper', 'Scissors'];
        document.querySelectorAll('.btn').forEach(btn =>
          btn.addEventListener('click', (e) => this.playRound(e.currentTarget.dataset.choice))
        );
      }

      getComputerChoice = () => {
        const index = Math.floor(Math.random() * 3);
        return this.choices[index];
      };

      playRound(playerChoice) {
        if (this.gameOver) return;

        const computerChoice = this.getComputerChoice();
        let winner = '';

        if (playerChoice === computerChoice) {
          winner = 'tie';
        } else if (
          (playerChoice === 'Rock' && computerChoice === 'Scissors') ||
          (playerChoice === 'Paper' && computerChoice === 'Rock') ||
          (playerChoice === 'Scissors' && computerChoice === 'Paper')
        ) {
          winner = 'player';
          this.playerScore++;
        } else {
          winner = 'computer';
          this.computerScore++;
        }

        this.displayResult(playerChoice, computerChoice, winner);
        this.updateScores();
        this.checkEndGame();
      }

      displayResult(player, computer, winner) {
        let message = '';
        if (winner === 'tie') {
          message = `🟡 Round ${this.round}: It's a tie! You both chose ${player}.`;
        } else if (winner === 'player') {
          message = `✅ Round ${this.round}: You win! ${player} beats ${computer}.`;
        } else {
          message = `❌ Round ${this.round}: You lose! ${computer} beats ${player}.`;
        }

        this.resultEl.textContent = message;
        this.resultEl.classList.add('highlight');
        setTimeout(() => this.resultEl.classList.remove('highlight'), 300);
        this.round++;
      }

      updateScores() {
        this.playerScoreEl.textContent = `👤 Player: ${this.playerScore}`;
        this.computerScoreEl.textContent = `💻 Computer: ${this.computerScore}`;
      }

      checkEndGame() {
        if (this.playerScore >= this.winningScore || this.computerScore >= this.winningScore) {
          this.gameOver = true;
          this.modalMsg.textContent = this.playerScore > this.computerScore ? '🎉 You win the game!' : '😞 Computer wins the game!';
          this.modal.style.display = 'flex';
        }
      }

      reset(fromModal = false) {
        this.playerScore = 0;
        this.computerScore = 0;
        this.round = 1;
        this.gameOver = false;
        this.resultEl.textContent = '';
        this.updateScores();
        if (fromModal) {
          this.modal.style.display = 'none';
        }
      }
    }

    const game = new RPSGame();
  </script>
</body>
</html>
