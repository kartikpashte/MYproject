<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Kartik Pashte</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ====================================
           1. Global Variables & Reset
           ==================================== */
        :root {
            /* NEW COLOR PALETTE: Dark Gray & Electric Blue */
            --primary-bg: #1e1e1e; /* Deep Charcoal Gray */
            --secondary-bg: #2c2c2c; /* Card/Element Background */
            --input-bg: #383838; /* Input field background */
            --accent-color: #00aaff; /* Electric Blue Accent */
            --text-color-light: #f0f4f8; /* Light Off-White */
            --text-color-dark: #121212; /* Dark text for button */
            --border-radius-lg: 12px;
            --transition-speed: 0.4s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Using a subtle dark gradient */
            background: linear-gradient(135deg, var(--primary-bg), #121212);
            color: var(--text-color-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* ====================================
           2. Layout & Heading
           ==================================== */
        h1 {
            text-align: center;
            font-size: 3.2rem;
            font-weight: 300;
            color: var(--text-color-light);
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-content {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 40px;
            flex-wrap: wrap;
        }

        .contact-panel {
            background-color: var(--secondary-bg);
            border-radius: var(--border-radius-lg);
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            flex: 1 1 45%;
            min-width: 350px;
            transition: transform var(--transition-speed) ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-panel:hover {
            transform: translateY(-5px); 
        }
        
        /* Animation setup */
        .left-form {
            animation: slideInLeft 1s ease-out forwards;
        }

        .right-info {
            animation: slideInRight 1s ease-out forwards;
        }


        /* ====================================
           3. Form Styling
           ==================================== */
        label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color-light);
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border: 2px solid var(--secondary-bg);
            background-color: var(--input-bg);
            border-radius: 6px;
            font-size: 16px;
            color: var(--text-color-light);
            transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: var(--accent-color); /* Electric Blue border */
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.6);
            outline: none;
            background-color: #333; /* Slightly lighter on focus */
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color); /* Electric Blue button */
            border: none;
            border-radius: 6px;
            color: var(--text-color-dark);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out, transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #33bbff; /* Lighter blue hover */
            transform: translateY(-1px);
        }

        /* ====================================
           4. Info & Social Styling
           ==================================== */
        .contact-info .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .contact-info i {
            font-size: 26px;
            color: var(--accent-color); /* Electric Blue icon */
            margin-right: 15px;
            flex-shrink: 0;
        }

        .contact-info a {
            color: var(--accent-color); /* Electric Blue link */
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .contact-info a:hover {
            color: #33bbff;
            text-decoration: underline;
        }

        /* Location Placeholder Feature */
        .map-placeholder {
            width: 100%;
            height: 200px;
            background-color: #121212;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555; /* Darker muted color */
            font-style: italic;
            font-size: 0.9rem;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
        
        .map-placeholder i {
            font-size: 36px;
            color: #555;
            margin-right: 10px;
        }


        /* Social Icons */
        #social-icons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
            width: 100%;
        }

        #social-icons a i {
            font-size: 24px;
            padding: 10px;
            border-radius: 50%;
            background-color: var(--primary-bg);
            color: var(--text-color-light);
            border: 2px solid var(--accent-color); /* Electric Blue border */
            transition: all 0.3s ease-in-out;
        }

        #social-icons a i:hover {
            background-color: var(--accent-color); /* Electric Blue fill */
            border-color: var(--text-color-light);
            color: var(--primary-bg);
            transform: scale(1.15);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            padding-top: 20px;
            font-size: 0.9rem;
            color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            text-align: center;
        }
        
        /* ====================================
           5. Mobile Responsiveness & Animations
           ==================================== */
        @media (max-width: 900px) {
            .main-content {
                gap: 30px;
            }
            .contact-panel {
                flex: 1 1 100%;
                min-width: auto;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2.5rem;
                margin-bottom: 30px;
            }
            .contact-panel {
                padding: 25px;
            }
            .contact-info .info-row {
                font-size: 1rem;
            }
            .map-placeholder {
                height: 150px;
            }
        }
        
        /* Keyframe Animations */
        @keyframes slideInLeft {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

<body>

    <h1>Get In Touch</h1>

    <main class="main-content">
        <div class="contact-panel left-form">
            <form action="#" method="POST">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="Enter your email" name="email" required>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="I'd like to discuss a project..." rows="6" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <div class="contact-panel right-info">
            
            <div class="map-placeholder">
                <i class="fa-solid fa-map-location-dot"></i>
                Location Map Placeholder
            </div>

            <div class="contact-info">
                <div class="info-row">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>India, Maharashtra, Pune, 412101</p>
                </div>

                <div class="info-row">
                    <i class="fa-solid fa-phone"></i>
                    <p>+91 9022567927</p>
                </div>

                <div class="info-row">
                    <i class="fa-solid fa-envelope"></i>
                    <p><a href="mailto:kartikpashte58@gmail.com">kartikpashte58@gmail.com</a></p>
                </div>
            </div>

            <div id="social-icons">
                <a href="https://www.youtube.com/@Crazythings689" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/kartik_151_" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" aria-label="Facebook" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Kartik Pashte. All rights reserved.</p>
    </footer>

</body>

</html>
